<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SellerScout · 汽配选品</title>
<style>
:root{
  --ink:#17191d;--ink2:#3b3f47;--muted:#686d76;--faint:#6a6e76;
  --canvas:#f4f3ef;--card:#fff;--line:#e5e2db;--line2:#d8d4ca;--hover:#f1efe9;
  --band:#17191d;--band2:#23262c;--band3:#30343b;--bandtext:#e9e7e1;--bandmuted:#a3a8b0;
  --amber:#f2b01e;--amber-soft:#fff3d1;--amber-ink:#7a5300;
  --pass:#0b6b4f;--pass-bg:#e5f3ec;--fail:#a3271b;--fail-bg:#fcebe8;
  --radius:12px;--font:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 var(--font);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top band ---------- */
.band{background:var(--band);color:var(--bandtext)}
.band :focus-visible{outline-color:var(--amber)}
.band-in{max-width:1440px;margin:0 auto;padding:0 28px}
.topline{display:flex;align-items:center;gap:18px;height:64px}
.brand{font-weight:750;font-size:17px;letter-spacing:.3px;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand small{font-weight:400;font-size:13px;color:var(--bandmuted);letter-spacing:0}
.mode{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bandmuted);border:1px solid var(--band3);border-radius:999px;padding:4px 12px;white-space:nowrap}
.mode a{color:var(--amber);text-decoration:none;border-left:1px solid var(--band3);padding-left:8px}
.mode a:hover{text-decoration:underline}
.mode-dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.mode-dot.mode-collected,.mode-dot.mode-api-sample,.mode-dot.mode-cache{background:#5cc79a}
.mode-note{color:#f0c46a}
.saved-btn{display:flex;align-items:center;gap:8px;background:var(--amber);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font-weight:650;white-space:nowrap}
.saved-btn:hover{background:#ffc23d}
.saved-btn b{background:var(--ink);color:var(--amber);border-radius:999px;min-width:22px;padding:0 6px;font-size:12px;line-height:20px;text-align:center}
.rules{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:2px 0 18px;font-size:12px;color:var(--bandmuted)}
.rules span{background:var(--band2);border:1px solid var(--band3);border-radius:6px;padding:3px 9px;color:var(--bandtext)}
.rules .pref{background:transparent;border-style:dashed;color:var(--bandmuted)}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tier{position:relative;text-align:left;background:var(--band2);border:1px solid var(--band3);border-bottom:0;border-radius:12px 12px 0 0;padding:14px 18px 16px;color:var(--bandtext);display:grid;gap:4px}
.tier:hover{background:#2a2e35}
.tier.active{background:var(--canvas);color:var(--ink);border-color:var(--canvas)}
.tier-top{display:flex;align-items:center;gap:10px}
.tier strong{font-size:17px;font-weight:700}
.meter{display:inline-flex;gap:3px}
.meter i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.meter i.on{background:currentColor;opacity:1}
.tier.active .meter i.on{background:var(--amber);border-color:#c98a0b}
.tier-num{font-size:13px;color:var(--bandmuted)}
.tier-num b{font-size:20px;font-weight:700;color:var(--bandtext);margin-right:3px}
.tier-num .sep{margin:0 8px;opacity:.5}
.tier.active .tier-num{color:var(--muted)}
.tier.active .tier-num b{color:var(--ink)}
.tier-desc{font-size:12px;color:var(--bandmuted)}
.tier.active .tier-desc{color:var(--muted)}

/* ---------- layout ---------- */
main{max-width:1440px;margin:0 auto;padding:22px 28px 48px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
.tree-panel{position:sticky;top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.tree-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line)}
.tree-head b{color:var(--ink2);font-size:13px}
#tree{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0}
#tree ul{list-style:none;margin:0;padding:0}
.trow{display:flex;align-items:center;gap:4px;min-height:32px;padding:4px 8px 4px calc(var(--lv) * 13px - 8px);border-radius:7px;cursor:pointer;color:var(--ink2);user-select:none}
.trow:hover{background:var(--hover)}
.trow.root{font-weight:650;color:var(--ink)}
.trow.trail .tname{font-weight:650;color:var(--ink)}
.trow.sel{background:var(--amber-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--amber)}
.trow.sel .tname{font-weight:700}
.trow:focus-visible{outline-offset:-2px}
.caret{flex:0 0 20px;height:20px;display:grid;place-items:center;border-radius:5px}
.caret::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(-45deg);transition:transform .12s}
.trow[aria-expanded="true"] > .caret::before{transform:rotate(45deg) translate(-1px,-1px)}
.caret:hover{background:#e6e3db}
.caret.none::before{content:none}
.tlabel{flex:1;min-width:0;line-height:1.35;padding:3px 0}
.tpre{color:var(--faint);font-size:12px}
.tcount{font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.tcount.zero{color:var(--faint)}
.trow.sel .tcount{color:var(--ink);font-weight:650}
.tree-toggle{display:none}

/* ---------- toolbar ---------- */
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,auto);gap:8px;margin-bottom:12px}
.search{position:relative}
.search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;border:1.8px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:22px;top:58%;width:6px;height:1.8px;background:var(--faint);transform:rotate(45deg)}
.toolbar input,.toolbar select{width:100%;height:40px;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:0 12px;font-size:13px;color:var(--ink)}
.toolbar input{padding-left:34px}
.toolbar select{min-width:132px;padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.toolbar select:hover,.toolbar input:hover{border-color:#bfb9ad}
.resultbar{display:flex;align-items:center;gap:12px;min-height:34px;margin-bottom:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13px;min-width:0}
.crumb{border:0;background:none;padding:3px 5px;border-radius:5px;color:var(--muted)}
button.crumb:hover{background:#e9e6df;color:var(--ink)}
.crumb.cur{color:var(--ink);font-weight:650}
.crumb-sep{color:#b2b5ba}
.count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink)}
.reset-all{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:3px 4px}

/* ---------- list ---------- */
.group{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:650;color:var(--ink2);margin:22px 2px 8px}
.group:first-child{margin-top:4px}
.group small{font-weight:400;color:var(--faint)}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.cat-head{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
.cat-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.cat-title h3{margin:0;font-size:18px;line-height:1.3;font-weight:700}
.cat-amazon-link{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;font-size:15px;color:var(--muted);text-decoration:none;border-radius:5px}
.cat-amazon-link:hover{color:var(--ink);background:var(--line)}
.cat-amazon-link:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.cat-count{font-size:12px;color:var(--muted);white-space:nowrap}
.ext{font-size:12px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;white-space:nowrap}
.ext:hover{text-decoration-color:var(--ink)}
.signals{display:flex;align-items:center;flex-wrap:wrap;gap:6px 22px;padding:2px 20px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.signals b{color:var(--ink);font-weight:650;margin-left:4px}
.signals b.muted{color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;margin-left:6px;line-height:18px}
.pill.ok{background:var(--pass-bg);color:var(--pass)}
.pill.warn{background:var(--amber-soft);color:var(--amber-ink)}
.link-btn{margin-left:auto;border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:3px 10px;font-size:12px;color:var(--ink2)}
.link-btn:hover{background:var(--hover)}
.link-btn[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{padding:0 20px}
.no-picks{margin:0;padding:16px 0;color:var(--muted);font-size:13px}

.product{display:grid;grid-template-columns:112px minmax(220px,1fr) auto 104px;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.product:last-child{border-bottom:0}
.pimg{display:block;width:112px;height:112px;border-radius:10px;border:1px solid var(--line);background:#fff;overflow:hidden;position:relative}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
a.pimg:hover{border-color:var(--ink2);box-shadow:0 4px 14px rgba(23,25,29,.08)}
a.pimg::after{content:"↗";position:absolute;right:5px;bottom:4px;font-size:11px;line-height:16px;width:18px;text-align:center;border-radius:5px;background:rgba(23,25,29,.75);color:#fff;opacity:0;transition:opacity .12s}
a.pimg:hover::after,a.pimg:focus-visible::after{opacity:1}
.noimg{display:grid;place-items:center;width:100%;height:100%;font-size:12px;color:var(--faint);background:#faf9f6}
.pinfo{min-width:0}
.ptitle{font-size:15px;font-weight:650;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phl{font-size:12.5px;color:var(--muted);margin-top:3px}
.phl span+span::before{content:" · ";color:#b5b8bd}
.pmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;font-weight:600;letter-spacing:.3px;border:1px solid var(--line2);border-radius:5px;padding:0 6px;line-height:19px;color:var(--ink2);background:#fff}
.tag.vc{background:var(--ink);border-color:var(--ink);color:#fff}
.tag.unknown{border-style:dashed;color:var(--muted);font-weight:500}
.tag.pending{border-color:#e7c46d;color:var(--amber-ink);background:var(--amber-soft)}
.pkg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;font-size:12px;color:var(--muted)}
.pkg-dims b{color:var(--ink2);font-weight:650}
.pkg .dot{margin:0 5px;color:#b5b8bd}
.pkg-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;border-radius:5px;padding:0 7px 0 5px;line-height:20px}
.pkg-badge i{font-style:normal;font-size:11px}
.pkg-badge.pass{background:var(--pass-bg);color:var(--pass)}
.pkg-badge.fail{background:var(--fail-bg);color:var(--fail)}
.pkg-badge.unknown{background:#f1f0ec;color:#55595f;outline:1px dashed #b9b6ad;outline-offset:-1px}
.metrics{display:grid;grid-template-columns:96px 72px 92px 56px 76px;gap:14px}
.metric small{display:block;font-size:11.5px;color:var(--faint);margin-bottom:2px;white-space:nowrap}
.metric b{display:block;font-size:16px;font-weight:650;white-space:nowrap;color:var(--ink)}
.metric.price b{font-size:18px;font-weight:750}
.metric.date b{font-size:14px;font-weight:600;padding-top:2px}
.save{justify-self:end;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.save:hover{background:var(--hover)}
.save.on{background:var(--amber);border-color:#c98a0b}
.save.on:hover{background:#ffc23d}

/* evidence */
.evidence{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;padding:16px 20px;background:#faf9f6;border-bottom:1px solid var(--line)}
.fourth{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-self:start}
.fourth small{font-size:12px;color:var(--muted)}
.fourth strong{display:block;font-size:32px;font-weight:750;line-height:1.2;margin:6px 0 4px}
.fourth strong span{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.fourth p{margin:0 0 8px;font-size:12px;color:var(--ink2)}
.trend{min-width:0}
.trend-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.lg i{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.lg0 i{border-color:#22262d}.lg1 i{border-color:#c98a0b;border-top-style:dashed}.lg2 i{border-color:#6f7f9e;border-top-style:dotted}
canvas{display:block;width:100%;height:168px;margin-top:6px}
.trendtip{font-size:12px;color:var(--ink2);min-height:20px}
.nodata{color:var(--muted);font-size:13px}
.mtable{font-size:12px;color:var(--muted);margin-top:4px}
.mtable summary{cursor:pointer;padding:2px 0}
.tablewrap{overflow:auto}
.mtable table{border-collapse:collapse;width:100%;margin-top:6px;text-align:right;color:var(--ink2)}
.mtable th,.mtable td{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mtable th[scope=row]{text-align:left}
.mtable th small{display:block;color:var(--faint);font-weight:400}
.mtable td.sp{font-weight:650;color:var(--ink)}
.mtable tr.max th,.mtable tr.max td{background:var(--amber-soft)}
.signals .sub{margin-left:8px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:2px 10px;font-size:12px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.top3{margin:6px 0 0;font-size:12px;color:var(--ink2)}
.rankdet{font-size:12px;margin:0 0 8px;color:var(--muted)}
.rankdet summary{cursor:pointer;padding:2px 0}
.rankdet table{border-collapse:collapse;width:100%;margin-top:4px;color:var(--ink2)}
.rankdet th,.rankdet td{text-align:left;padding:3px 6px 3px 0;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:400}
.rankdet tr.used td{font-weight:650;color:var(--ink)}
.rankdet a{color:inherit}

.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--radius);padding:56px 20px;text-align:center}
.empty h3{margin:0 0 16px;font-size:16px}
.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.small{padding:4px 10px;font-size:12px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.primary:hover{background:#2c3038}
.btn:disabled{opacity:.4;cursor:default}
.foot{max-width:1440px;margin:0 auto;padding:0 28px 32px;font-size:12px;color:var(--faint)}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(1180px,94vw);max-height:88vh;color:var(--ink);box-shadow:0 30px 90px rgba(23,25,29,.3)}
dialog::backdrop{background:rgba(23,25,29,.55)}
.dlg-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:18px;flex:1}
.dlg-head small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.dlg-body{padding:6px 22px 22px}
.savedtable{border-collapse:collapse;width:100%;min-width:960px;font-size:13px}
.savedtable th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line2)}
.savedtable td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.savedtable img,.savedtable .noimg{width:72px;height:72px;object-fit:contain;border:1px solid var(--line);border-radius:8px;display:block}
.savedtable .stitle{min-width:220px;max-width:300px}
.savedtable .stitle p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.savedtable .num{white-space:nowrap}
.savedtable .pkg{margin-top:0}
.savedtable tr.stale td{opacity:.7}
.saved-empty{padding:48px 20px;text-align:center;color:var(--muted)}
.export-error{color:var(--fail);font-size:12px}

/* ---------- responsive ---------- */
@media (max-width:1320px){
  .product{grid-template-columns:96px minmax(0,1fr) 96px;grid-template-areas:"img info save" "img metrics metrics";row-gap:10px}
  .pimg{grid-area:img;width:96px;height:96px;align-self:start}
  .pinfo{grid-area:info}.metrics{grid-area:metrics}.save{grid-area:save;align-self:start}
  .metrics{grid-template-columns:repeat(5,minmax(0,max-content));gap:6px 22px}
}
@media (max-width:1100px){
  main{grid-template-columns:228px minmax(0,1fr);gap:16px;padding:18px 18px 40px}
  .band-in,.foot{padding-left:18px;padding-right:18px}
  .toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toolbar .search{grid-column:1/-1}
  .toolbar select{min-width:0}
}
@media (max-width:860px){
  main{display:block}
  .tree-panel{position:static;max-height:none;margin-bottom:12px}
  .tree-toggle{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font-size:14px}
  .tree-toggle b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tt-caret{margin-left:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg)}
  .tree-toggle[aria-expanded="true"] .tt-caret{transform:rotate(-135deg)}
  .tree-head,#tree{display:none}
  .tree-panel.open .tree-head{display:flex;border-top:1px solid var(--line)}
  .tree-panel.open #tree{display:block;max-height:60vh}
  .tier-desc{display:none}
  .tier{padding:10px 12px 12px}
  .tier strong{font-size:15px}
  .tier-num b{font-size:17px}
  .rules{padding-bottom:14px}
}
@media (max-width:600px){
  .topline{height:auto;padding:12px 0;flex-wrap:wrap;gap:10px}
  .brand small{display:none}
  .mode{order:3;margin-left:0;width:100%;justify-content:flex-start;flex-wrap:wrap;white-space:normal}
  .saved-btn{margin-left:auto}
  .tiers{gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .tier{padding:9px 10px 11px}
  .tier-top{gap:4px;flex-direction:column;align-items:flex-start}
  .tier strong{font-size:14px;white-space:nowrap}
  .rules{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
  .rules span{white-space:nowrap}
  .tier-num .sep{margin:0 4px}
  .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-head,.signals,.plist{padding-left:14px;padding-right:14px}
  .cat-head{flex-wrap:wrap;row-gap:2px}
  .link-btn{margin-left:0}
  .product{grid-template-columns:76px minmax(0,1fr);grid-template-areas:"img info" "metrics metrics" "save save";gap:10px 12px}
  .pimg{width:76px;height:76px}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;background:#faf9f6;border-radius:8px;padding:8px 10px}
  .metric b{font-size:15px}.metric.price b{font-size:16px}
  .save{justify-self:stretch}
  .evidence{grid-template-columns:1fr;padding:14px}
